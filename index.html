<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindU — Public Technical Portal & Architecture Specification</title>
    <meta
      name="description"
      content="FindU Public Technical Portal: Engineering architecture, mathematical pipeline, and empirical evaluation for missing-person multi-camera tracking."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/assets/hero-transit-concourse.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('findu-theme');
          if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
          document.documentElement.setAttribute('data-theme', t || 'light');
        } catch(e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
